name: Main CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Use Node.js 
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: echo "$E" > .env
        env:
          E: ${{ secrets.ENV }}

      - run: npm ci
      - name: build
        run: |
          npm run build
